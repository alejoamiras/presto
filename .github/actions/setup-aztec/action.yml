name: Setup Aztec
description: Install Bun, Foundry, and Aztec CLI. Version auto-detected from packages/sdk/package.json.

inputs:
  skip_cli:
    description: Skip Foundry + Aztec CLI install (use when targeting a remote Aztec node)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - run: bun install --frozen-lockfile
      shell: bash

    - name: Detect Aztec version
      if: inputs.skip_cli != 'true'
      id: detect
      shell: bash
      run: |
        VERSION=$(bun scripts/aztec-manifest.ts packages/sdk/package.json aztec.js)
        echo "Aztec version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install Node.js 24
      if: inputs.skip_cli != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.20.0

    - name: Install Foundry
      if: inputs.skip_cli != 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        # Pinned, not "stable": aztec's L1 deploy wrapper (l1-contracts/scripts/forge_broadcast.js,
        # since 4.3.1) passes `--batch-size` WITHOUT `--batch`; foundry 1.7 made `--batch-size`
        # require the new `--batch` flag, so a floating stable (1.7.1) fails the deploy with
        # "required arguments were not provided: --batch". v1.4.1 is the lineage aztec bundles and
        # tests against. Revisit when aztec's wrapper supports the 1.7 CLI.
        version: v1.4.1

    - name: Cache Aztec CLI
      if: inputs.skip_cli != 'true'
      id: cache-aztec
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.aztec/versions/${{ steps.detect.outputs.version }}
        # The `-minage7` salt is load-bearing, not decoration. The aztec version alone does NOT
        # identify the tree: the installer resolves transitive dependencies unlocked, so the same
        # version installed on two days can differ — which is how `snappy@7.4.0` got in. Once a broken
        # tree is cached, the install step is skipped by its `cache-hit` guard and any fix applied
        # THERE never runs; the cache just keeps serving the breakage. Bump this salt whenever the
        # install recipe changes so the remedy is actually exercised.
        key: ${{ runner.os }}-aztec-${{ steps.detect.outputs.version }}-minage7-npm12-exactexempt-allowscripts7

    - name: Install Aztec CLI
      if: inputs.skip_cli != 'true' && steps.cache-aztec.outputs.cache-hit != 'true'
      shell: bash
      run: |
        export CI=1
        export FOUNDRY_DIR="$HOME/.foundry"
        # The installer runs its own unlocked `npm install`, outside bunfig's quarantine, so its
        # transitive tree gets the same 7 days: `snappy@7.4.0` (2026-08-12) could not load its native
        # binding and broke `aztec start` on every Aztec version at once. Its error names
        # `@napi-rs/snappy-wasm32-wasi`, which is correctly absent on linux-x64; installing it only
        # advances into the broken WASI path.
        export npm_config_min_release_age=7
        # The quarantine would also ETARGET the Aztec release itself for its first 7 days, so the
        # reviewed names in `installer-aztec-packages.txt` are exempt, one exact name each (a scope
        # glob would exempt a new package unreviewed); third-party transitives keep the 7 days, and
        # the graph check below holds the list exact. `min-release-age-exclude` needs npm 12; Node
        # 24 bundles npm 11.
        npm install -g npm@12.0.2
        AZTEC_LIST="$GITHUB_WORKSPACE/.github/actions/setup-aztec/installer-aztec-packages.txt"
        # npm 12 blocks dependency install scripts by default (allowScripts). Reviewed minimal
        # allowlist, exactly the seven script-bearing packages in aztec 6.0.0-rc.1's tree (npm <12
        # ran ALL install scripts, so this is strictly narrower than the pre-upgrade behavior):
        # bcrypto is REQUIRED (plain node-gyp rebuild, no prebuilds — blocking it kills
        # `aztec start` with "Cannot find module 'bcrypto.node'"); leveldown, lmdb and
        # msgpackr-extract resolve prebuilds; protobufjs and unrs-resolver run read-only
        # postinstalls; @parcel/watcher (via jest) builds only when npm_config_build_from_source is
        # set. Review this list when the blocked-packages warning names new entries.
        # Mechanism: a userconfig FILE, NOT the flag/env form — npm 12 rejects --allow-scripts on
        # project-scoped installs (EALLOWSCRIPTS; the installer uses `npm install --prefix`). A
        # step-scoped temp file (not $HOME/.npmrc) keeps the settings from leaking into later job
        # steps or surviving on a non-ephemeral runner, and entries are VERSION-PINNED to the
        # reviewed identities (npm's recommendation): a future version bump of any of them fails
        # closed with a named blocked-packages warning → re-review, update the pin here.
        NPMRC="$(mktemp)"
        INSTALL_SCRIPT="$(mktemp)"
        trap 'rm -f "$NPMRC" "$INSTALL_SCRIPT"' EXIT
        while IFS= read -r name; do
          echo "min-release-age-exclude[]=$name" >> "$NPMRC"
        done < "$AZTEC_LIST"
        for p in bcrypto@5.5.2 leveldown@6.1.1 lmdb@3.5.6 msgpackr-extract@3.0.4 protobufjs@7.6.6 unrs-resolver@1.12.2 @parcel/watcher@2.6.0; do
          echo "allow-scripts[]=$p" >> "$NPMRC"
        done
        export NPM_CONFIG_USERCONFIG="$NPMRC"
        # Prove the configuration npm will use, not the file: `npm config get` prints the parsed
        # array comma-joined.
        EFFECTIVE="$(npm config get min-release-age-exclude)"
        if [ "$EFFECTIVE" != "$(paste -sd, "$AZTEC_LIST")" ]; then
          echo "::error::npm's effective min-release-age-exclude differs from installer-aztec-packages.txt: $EFFECTIVE"
          exit 1
        fi
        curl -fsSL "https://install.aztec.network/${{ steps.detect.outputs.version }}/install" -o "$INSTALL_SCRIPT"
        VERSION=${{ steps.detect.outputs.version }} bash "$INSTALL_SCRIPT"
        ls -la ~/.aztec/versions/${{ steps.detect.outputs.version }}/bin/

    # Runs on a cache hit too: the npmrc assertion proves the age-gate configuration, not what the
    # unlocked installer resolved.
    - name: Check the installed Aztec graph against the reviewed list
      if: inputs.skip_cli != 'true'
      shell: bash
      run: bun scripts/aztec-installer-graph.ts "$HOME/.aztec/versions/${{ steps.detect.outputs.version }}" .github/actions/setup-aztec/installer-aztec-packages.txt "${{ steps.detect.outputs.version }}"

    # A `snappy` that cannot load its binding otherwise surfaces only as `aztec start` timing out ~10
    # minutes later, with ERR_MODULE_NOT_FOUND buried in the node log; fail here, naming the cause.
    - name: Verify the Aztec CLI can load its native dependencies
      if: inputs.skip_cli != 'true'
      shell: bash
      run: |
        AZTEC_DIR="$HOME/.aztec/versions/${{ steps.detect.outputs.version }}"
        probe() { node -e 'import("snappy").then(()=>process.exit(0)).catch(e=>{console.error(String(e));process.exit(1)})' 2>&1; }
        cd "$AZTEC_DIR"
        if probe; then
          echo "aztec's snappy binding loads"
          exit 0
        fi
        # Diagnose only. Three in-CI repairs (the bindings at @latest, the linux-x64-gnu binding, every
        # declared binding) failed or churned the tree: the break is in the upstream install. The fix is
        # an Aztec bump through aztec-stable.yml, a reviewed PR, never a side effect of this step.
        echo "::error::aztec ${{ steps.detect.outputs.version }} installed without a usable snappy binding, so \`aztec start\` cannot run. UPSTREAM packaging break, not a fault in this repository. Three in-CI repair attempts failed (see this step's comment). Fix by bumping Aztec via aztec-stable.yml, or wait for upstream."
        exit 1

    - name: Update PATH
      if: inputs.skip_cli != 'true'
      shell: bash
      run: |
        echo "$HOME/.aztec/versions/${{ steps.detect.outputs.version }}/bin" >> $GITHUB_PATH
        echo "$HOME/.aztec/versions/${{ steps.detect.outputs.version }}/node_modules/.bin" >> $GITHUB_PATH

    - name: Ensure foundry-toolchain forge wins over the aztec-bundled forge
      if: inputs.skip_cli != 'true'
      shell: bash
      run: |
        # The aztec bundle ships its own forge in versions/<v>/bin. Since aztec 4.3.1 the L1 deploy
        # path (l1-contracts/scripts/forge_broadcast.js) spawns bare `forge` with upstream-foundry
        # args, but the 4.3.1-bundled forge's `script` CLI is incompatible (requires `--batch`) —
        # the local network then fails L1 deploy and never comes up. The aztec bin dir was prepended
        # to PATH above (the CLI itself needs it), so neutralize just the bundled forge: the
        # foundry-toolchain forge (installed earlier in this action) must be the one that resolves.
        AZTEC_BIN="$HOME/.aztec/versions/${{ steps.detect.outputs.version }}/bin"
        if [ -x "$AZTEC_BIN/forge" ]; then
          mv "$AZTEC_BIN/forge" "$AZTEC_BIN/forge.aztec-bundled"
          echo "Renamed aztec-bundled forge out of the way: $AZTEC_BIN/forge.aztec-bundled"
        fi
        command -v forge >/dev/null || { echo "::error::no foundry-toolchain forge on PATH"; exit 1; }
        echo "forge now resolves to: $(command -v forge) ($(forge --version | head -1))"
