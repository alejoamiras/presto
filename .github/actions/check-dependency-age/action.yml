name: Check dependency release age
description: Reject changed resolved dependencies and remote Actions published less than seven days ago.

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: result-cache
      with:
        path: ${{ runner.temp }}/presto-dependency-age
        key: dependency-age-v1-${{ runner.os }}-${{ github.event.pull_request.base.sha || github.event.before }}-${{ hashFiles('bun.lock', '**/Cargo.lock', 'scripts/dependency-age.ts', '.github/**/*.yml', '.github/**/*.yaml') }}

    - name: Check changed dependency references
      if: steps.result-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEPENDENCY_AGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        BASE_SHA="$DEPENDENCY_AGE_BASE"
        if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
          echo "No change base exists for this event; dependency age is checked on pull requests and pushes."
          exit 0
        fi
        if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::invalid dependency-age base: $BASE_SHA"
          exit 1
        fi
        git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
        bun scripts/dependency-age.ts --base "$BASE_SHA"
        # The cache marker is written only after the exact base/content pair passes every check.
        mkdir -p "$RUNNER_TEMP/presto-dependency-age"
        touch "$RUNNER_TEMP/presto-dependency-age/passed"
