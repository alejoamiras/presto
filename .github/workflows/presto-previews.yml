name: Presto PR previews

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/landing/**"
      - "packages/playground/**"
      - "packages/sdk/**"
      - "bun.lock"
      - ".github/workflows/presto-previews.yml"

permissions:
  contents: read

concurrency:
  group: presto-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'alejoamiras/presto' && github.event.pull_request.head.repo.full_name == github.repository && vars.PRESTO_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        site: [landing, playground]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build without deployment credentials
        env:
          SITE: ${{ matrix.site }}
          AZTEC_NODE_URL: https://v5.testnet.rpc.aztec-labs.com
        run: bun run --cwd "packages/$SITE" build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presto-preview-${{ matrix.site }}
          path: packages/${{ matrix.site }}/dist
          if-no-files-found: error
          retention-days: 7

  upload:
    needs: build
    if: github.repository == 'alejoamiras/presto' && github.event.pull_request.head.repo.full_name == github.repository && vars.PRESTO_PREVIEWS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        site: [landing, playground]
    steps:
      # No checkout or execution of PR code in the credentialed job; only static assets are uploaded.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: presto-preview-${{ matrix.site }}
          path: dist
      - name: Install the pinned deployment CLI without lifecycle scripts
        run: |
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          npm install --before="$cutoff" --ignore-scripts --no-audit --no-fund \
            --prefix "$RUNNER_TEMP/presto-preview-cli" wrangler@4.127.1
      - name: Write fixed preview configuration
        env:
          SITE: ${{ matrix.site }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const site = process.env.SITE;
          if (!['landing', 'playground'].includes(site)) throw new Error('Invalid preview site');
          const config = {
            name: `presto-${site}`,
            compatibility_date: '2026-08-22',
            workers_dev: true,
            preview_urls: true,
            assets: {
              directory: path.join(process.env.GITHUB_WORKSPACE, 'dist'),
              not_found_handling: 'single-page-application',
            },
          };
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'presto-preview.json'), JSON.stringify(config));
          NODE
      - name: Upload immutable version with stable PR alias
        env:
          SITE: ${{ matrix.site }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/presto-preview-cli/node_modules/.bin/wrangler" versions upload \
            --config "$RUNNER_TEMP/presto-preview.json" --preview-alias "pr-$PR_NUMBER"
          echo "Preview: https://pr-$PR_NUMBER-presto-$SITE.alejo-amiras.workers.dev" >> "$GITHUB_STEP_SUMMARY"
