name: Release SDK

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Which npm packages to release (scripts/npm-packages.ts keys, or all in dependency order)"
        required: false
        type: choice
        options:
          - presto
          - presto-core
          - presto-noir
          - presto-banners
          - all
        default: presto
      dry_run:
        description: "Plan and preflight only: publish nothing, report which dependency checks would be deferred"
        required: false
        type: boolean
        default: false

# npm publication is irreversible. Never cancel an in-flight release, and verify that a
# dispatch actually starts because GitHub retains at most one queued run per group.
concurrency:
  group: release-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-main:
    name: Assert main ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Require finalized Presto release identity
        run: bun scripts/presto-release-readiness.ts

      - name: Assert dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release SDK must be dispatched from refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi

  # Decides publish / reuse / collision for every selected package before anything is published, using
  # only registry-independent checks plus what is already on npm. A dependency published in this run
  # cannot have its provenance or a registry-consumer rerun checked here; the plan lists those as
  # deferred and the publish jobs perform them in order.
  plan:
    name: Release plan
    needs: assert-main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish_presto: ${{ steps.plan.outputs.publish_presto }}
      version_presto: ${{ steps.plan.outputs.version_presto }}
      deps_presto: ${{ steps.plan.outputs.deps_presto }}
      publish_presto_core: ${{ steps.plan.outputs.publish_presto_core }}
      version_presto_core: ${{ steps.plan.outputs.version_presto_core }}
      deps_presto_core: ${{ steps.plan.outputs.deps_presto_core }}
      publish_presto_noir: ${{ steps.plan.outputs.publish_presto_noir }}
      version_presto_noir: ${{ steps.plan.outputs.version_presto_noir }}
      deps_presto_noir: ${{ steps.plan.outputs.deps_presto_noir }}
      publish_presto_banners: ${{ steps.plan.outputs.publish_presto_banners }}
      version_presto_banners: ${{ steps.plan.outputs.version_presto_banners }}
      deps_presto_banners: ${{ steps.plan.outputs.deps_presto_banners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Reuse decisions run npm's signature audit, which needs the same npm as publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Plan the release
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Read-only: release records are looked up, never written, here.
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--packages "$PACKAGES")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bun scripts/release-plan.ts "${args[@]}"
      - name: Record the plan
        env:
          SUMMARY: ${{ steps.plan.outputs.summary }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Release plan (dry run: nothing is published)"
            else
              echo "## Release plan"
            fi
            echo '```'
            printf '%s\n' "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: [assert-main, plan]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/_e2e.yml
    with:
      ref: ${{ github.sha }}
      # SDK candidates must exercise the native proving path.
      build_presto: true

  dependency-audit:
    needs: [assert-main, plan]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/dependency-audit.yml

  # Dependencies first: the adapters' deferred checks (dependency provenance, consumer rerun against
  # the registry dependency) run inside their own publish job, after this one verified the artifact.
  publish-core:
    needs: [assert-main, plan, e2e, dependency-audit]
    if: ${{ !cancelled() && !inputs.dry_run && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.plan.outputs.publish_presto_core == 'true' }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto-core
      version: ${{ needs.plan.outputs.version_presto_core }}
      dependency_versions: ${{ needs.plan.outputs.deps_presto_core }}

  # The Noir adapter's production gates at the release SHA: bb.js WASM must reproduce the committed
  # fixtures, and the adapter must prove natively against a headless presto built from this commit.
  # The chonk SDK keeps the sandbox e2e above as its gate.
  noir-gates:
    needs: [assert-main, plan]
    if: ${{ !inputs.dry_run && needs.plan.outputs.publish_presto_noir == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_ts-package-ci.yml
    with:
      package: presto-noir
      identity: true
      live: true

  # Adapters publish after core, and presto after noir. A skipped noir publication is acceptable only
  # when noir was not selected — a selected noir whose gates failed also skips, and must block presto.
  publish-presto:
    needs: [assert-main, plan, e2e, dependency-audit, publish-core, publish-noir]
    if: ${{ !cancelled() && !inputs.dry_run && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.plan.outputs.publish_presto == 'true' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') && (needs.publish-noir.result == 'success' || (needs.publish-noir.result == 'skipped' && needs.plan.outputs.publish_presto_noir != 'true')) }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto
      version: ${{ needs.plan.outputs.version_presto }}
      release_asset: packages/sdk/MIGRATION.md
      dependency_versions: ${{ needs.plan.outputs.deps_presto }}

  publish-noir:
    needs: [assert-main, plan, e2e, dependency-audit, publish-core, noir-gates]
    if: ${{ !cancelled() && !inputs.dry_run && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.noir-gates.result == 'success' && needs.plan.outputs.publish_presto_noir == 'true' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto-noir
      version: ${{ needs.plan.outputs.version_presto_noir }}
      dependency_versions: ${{ needs.plan.outputs.deps_presto_noir }}

  # The banner kit has no workspace dependencies and no proving path: the shared gates are its only
  # preconditions, and it needs no ordering against the SDK packages.
  publish-banners:
    needs: [assert-main, plan, e2e, dependency-audit]
    if: ${{ !cancelled() && !inputs.dry_run && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.plan.outputs.publish_presto_banners == 'true' }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto-banners
      version: ${{ needs.plan.outputs.version_presto_banners }}
      dependency_versions: ${{ needs.plan.outputs.deps_presto_banners }}

  # Merging the pin PR deploys the playground: Workers Builds builds `main` from the pinned,
  # provenance-verified publications (scripts/workers-build.ts). A selected publication that failed
  # or was gated out blocks the bump; pins only move forward, so rerunning an older release is a no-op.
  bump-playground:
    name: Bump playground SDK pin
    needs: [plan, e2e, dependency-audit, publish-core, publish-noir, publish-presto]
    if: ${{ !cancelled() && !inputs.dry_run && needs.plan.result == 'success' && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && (needs.plan.outputs.publish_presto_core != 'true' || needs.publish-core.result == 'success') && (needs.plan.outputs.publish_presto_noir != 'true' || needs.publish-noir.result == 'success') && (needs.plan.outputs.publish_presto != 'true' || needs.publish-presto.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A short-lived release-bot App token (contents + pull requests) pushes the branch and opens the PR.
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The pin is raised against `main` as it is now, not the release SHA: an earlier pin PR may have
      # merged since this run started.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # No install: the pin script imports only repository modules, so no dependency code runs
      # next to the App token.
      - name: Raise the pin
        id: pin
        env:
          # Empty unless presto published in this run: the plan's version_presto is the next
          # publication, never a published one. The plan's noir version is set for a publication and
          # a verified reuse alike, so a redispatch catches the pin up with an earlier run's noir.
          PRESTO_VERSION: ${{ needs.publish-presto.outputs.version }}
          PRESTO_NOIR_VERSION: ${{ needs.plan.outputs.version_presto_noir }}
        run: |
          result="$(bun scripts/playground-pin.ts)"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      # Never combined with a pending pin PR: every way of merging two bumps could drop a version.
      - name: Open the pin PR
        if: steps.pin.outputs.result == 'changed'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: chore/playground-sdk-pin-${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open="$(gh pr list --state open --limit 1000 --json number,headRefName,isCrossRepository \
            --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("chore/playground-sdk-pin-"))) | "#\(.number)"] | join(" ")')"
          if [ -n "$open" ]; then
            echo "::error::playground pin PR $open is still open: merge it, then re-run this job (closing it drops its versions)"
            exit 1
          fi

          presto="$(jq -r '."@alejoamiras/presto"' packages/playground/published-sdk.json)"
          noir="$(jq -r '."@alejoamiras/presto-noir"' packages/playground/published-sdk.json)"
          title="chore(playground): build production from presto ${presto}, presto-noir ${noir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/playground/published-sdk.json
          git commit -m "$title"
          git push origin "$BRANCH"
          head="$(git rev-parse HEAD)"

          gh pr create --base main --head "$BRANCH" --title "$title" \
            --body "Raised by $RUN_URL. Merging deploys playground.presto.build through Workers Builds; App's Published Playground Build verifies the pinned publications first."
          gh pr merge "$BRANCH" --auto --squash --delete-branch --match-head-commit "$head"
