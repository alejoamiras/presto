name: Release SDK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Release the SDK candidate, deploy the testnet playground, or both"
        required: true
        type: choice
        options:
          - sdk-and-playground
          - sdk-only
          - playground-only
        default: sdk-and-playground
      packages:
        description: "Which npm packages to release (scripts/npm-packages.ts keys, or all in dependency order)"
        required: false
        type: choice
        options:
          - presto
          - presto-core
          - presto-noir
          - all
        default: presto
      dry_run:
        description: "Plan and preflight only: publish nothing, report which dependency checks would be deferred"
        required: false
        type: boolean
        default: false

# npm publication is irreversible. Never cancel an in-flight release, and verify that a
# dispatch actually starts because GitHub retains at most one queued run per group.
concurrency:
  group: release-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  assert-main:
    name: Assert main ref
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Require finalized Presto release identity
        run: bun scripts/presto-release-readiness.ts

      - name: Assert dispatched from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Release SDK must be dispatched from refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi

  # Decides publish / reuse / collision for every selected package before anything is published, using
  # only registry-independent checks plus what is already on npm. A dependency published in this run
  # cannot have its provenance or a registry-consumer rerun checked here; the plan lists those as
  # deferred and the publish jobs perform them in order.
  plan:
    name: Release plan
    needs: assert-main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish_presto: ${{ steps.plan.outputs.publish_presto }}
      version_presto: ${{ steps.plan.outputs.version_presto }}
      deps_presto: ${{ steps.plan.outputs.deps_presto }}
      publish_presto_core: ${{ steps.plan.outputs.publish_presto_core }}
      version_presto_core: ${{ steps.plan.outputs.version_presto_core }}
      deps_presto_core: ${{ steps.plan.outputs.deps_presto_core }}
      publish_presto_noir: ${{ steps.plan.outputs.publish_presto_noir }}
      version_presto_noir: ${{ steps.plan.outputs.version_presto_noir }}
      deps_presto_noir: ${{ steps.plan.outputs.deps_presto_noir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Reuse decisions run npm's signature audit, which needs the same npm as publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Plan the release
        id: plan
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Read-only: release records are looked up, never written, here.
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--packages "$PACKAGES")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          bun scripts/release-plan.ts "${args[@]}"
      - name: Record the plan
        env:
          SUMMARY: ${{ steps.plan.outputs.summary }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "## Release plan (dry run: nothing is published)"
            else
              echo "## Release plan"
            fi
            echo '```'
            printf '%s\n' "$SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: [assert-main, plan]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/_e2e.yml
    with:
      ref: ${{ github.sha }}
      # SDK candidates must exercise the native proving path. A playground-only hotfix keeps
      # the lighter WASM gate because it does not publish a new SDK artifact.
      build_presto: ${{ inputs.mode != 'playground-only' }}

  dependency-audit:
    needs: [assert-main, plan]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/dependency-audit.yml

  # Dependencies first: the adapters' deferred checks (dependency provenance, consumer rerun against
  # the registry dependency) run inside their own publish job, after this one verified the artifact.
  publish-core:
    needs: [assert-main, plan, e2e, dependency-audit]
    if: ${{ !cancelled() && !inputs.dry_run && inputs.mode != 'playground-only' && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.plan.outputs.publish_presto_core == 'true' }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto-core
      version: ${{ needs.plan.outputs.version_presto_core }}
      dependency_versions: ${{ needs.plan.outputs.deps_presto_core }}

  # The Noir adapter's production gates at the release SHA: bb.js WASM must reproduce the committed
  # fixtures, and the adapter must prove natively against a headless presto built from this commit.
  # The chonk SDK keeps the sandbox e2e above as its gate.
  noir-gates:
    needs: [assert-main, plan]
    if: ${{ !inputs.dry_run && inputs.mode != 'playground-only' && needs.plan.outputs.publish_presto_noir == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/_ts-package-ci.yml
    with:
      package: presto-noir
      identity: true
      live: true

  # Adapters publish after core; presto publishes after noir so the playground deployment that
  # follows sees both adapters on the registry.
  publish-presto:
    needs: [assert-main, plan, e2e, dependency-audit, publish-core, publish-noir]
    if: ${{ !cancelled() && !inputs.dry_run && inputs.mode != 'playground-only' && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.plan.outputs.publish_presto == 'true' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') && (needs.publish-noir.result == 'success' || needs.publish-noir.result == 'skipped') }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto
      version: ${{ needs.plan.outputs.version_presto }}
      release_asset: packages/sdk/MIGRATION.md
      dependency_versions: ${{ needs.plan.outputs.deps_presto }}

  publish-noir:
    needs: [assert-main, plan, e2e, dependency-audit, publish-core, noir-gates]
    if: ${{ !cancelled() && !inputs.dry_run && inputs.mode != 'playground-only' && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && needs.noir-gates.result == 'success' && needs.plan.outputs.publish_presto_noir == 'true' && (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') }}
    permissions:
      id-token: write
      contents: write
    uses: ./.github/workflows/_publish-npm.yml
    with:
      package: presto-noir
      version: ${{ needs.plan.outputs.version_presto_noir }}
      dependency_versions: ${{ needs.plan.outputs.deps_presto_noir }}

  deploy-app:
    needs: [assert-main, plan, e2e, dependency-audit, publish-presto]
    if: ${{ !cancelled() && !inputs.dry_run && inputs.mode != 'sdk-only' && needs.assert-main.result == 'success' && needs.e2e.result == 'success' && needs.dependency-audit.result == 'success' && (inputs.mode == 'playground-only' || needs.publish-presto.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # npm 10 omits verified attestations from its JSON signature-audit report.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Consume the exact verified published candidate
        env:
          PUBLISHED_VERSION: ${{ needs.publish-presto.outputs.version }}
        run: bun scripts/published-playground.ts "$PUBLISHED_VERSION"

      - name: Build playground
        env:
          AZTEC_NODE_URL: ${{ secrets.TESTNET_AZTEC_NODE_URL }}
        run: bun run --cwd packages/playground build

      - name: Deploy playground Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --config packages/playground/wrangler.jsonc
