name: Build Test Bundle

# Dispatch-only: build an INSTALLABLE desktop bundle from any ref and upload it as an artifact, so a
# human can smoke-test a branch on real hardware before it merges. Deliberately NOT a release:
#   - no version patching, no tag, no GitHub release, no production updater feed, no `latest.json`;
#   - no signing/notarization secrets (see the Gatekeeper note in the summary step) — this exists to
#     exercise flows that only a real OS can (the macOS Keychain trust dialog, the Windows root-CA
#     consent dialog, uninstall), not to ship anything.
# The real release path stays `release-presto.yml`.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which bundle to build (all runs automated packaged acceptance)"
        required: true
        type: choice
        default: macos-arm64
        options:
          - all
          - macos-arm64
          - macos-x86_64
          - linux-x86_64
          - windows-x86_64

permissions:
  contents: read

concurrency:
  group: build-test-bundle-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["linux-x86_64","macos-arm64","windows-x86_64"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-latest","macos-x86_64":"macos-15-intel","linux-x86_64":"ubuntu-latest","windows-x86_64":"windows-latest"}')[matrix.platform] }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-presto
        with:
          rust-target: ${{ fromJSON('{"macos-arm64":"aarch64-apple-darwin","macos-x86_64":"x86_64-apple-darwin","linux-x86_64":"x86_64-unknown-linux-gnu","windows-x86_64":"x86_64-pc-windows-msvc"}')[matrix.platform] }}
          rust-cache-key: presto-desktop-${{ fromJSON('{"macos-arm64":"aarch64-apple-darwin","macos-x86_64":"x86_64-apple-darwin","linux-x86_64":"x86_64-unknown-linux-gnu","windows-x86_64":"x86_64-pc-windows-msvc"}')[matrix.platform] }}
          rust-workspaces: packages/presto/src-tauri -> target
          rust-components: ""

      - name: Build bundle (unsigned)
        shell: bash
        working-directory: packages/presto
        env:
          TARGET: ${{ fromJSON('{"macos-arm64":"aarch64-apple-darwin","macos-x86_64":"x86_64-apple-darwin","linux-x86_64":"x86_64-unknown-linux-gnu","windows-x86_64":"x86_64-pc-windows-msvc"}')[matrix.platform] }}
        # Installer-only overlay: no production key and no unsigned updater artifacts.
        run: bunx tauri build --target "$TARGET" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect bundles
        shell: bash
        working-directory: packages/presto
        env:
          TARGET: ${{ fromJSON('{"macos-arm64":"aarch64-apple-darwin","macos-x86_64":"x86_64-apple-darwin","linux-x86_64":"x86_64-unknown-linux-gnu","windows-x86_64":"x86_64-pc-windows-msvc"}')[matrix.platform] }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist-test
          BUNDLE="src-tauri/target/$TARGET/release/bundle"
          # Copy whatever this platform produced (dmg/app.tar.gz, deb/AppImage, msi/exe).
          find "$BUNDLE" -maxdepth 2 \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' \) -exec cp {} ../../dist-test/ \;
          ls -la ../../dist-test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presto-${{ matrix.platform }}-${{ github.sha }}
          path: dist-test/*
          if-no-files-found: error
          retention-days: 7

      - name: Install notes
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'NOTES'
          ### Test bundle — ${{ matrix.platform }}

          Built from `${{ github.ref_name }}` @ `${{ github.sha }}`. Download it from this run's **Artifacts**.

          **This build is UNSIGNED** (no release secrets here), so the OS will object on first launch:

          - **macOS**: drag to Applications, then `xattr -dr com.apple.quarantine "/Applications/Presto.app"` and open it. (Right-click → Open also works.)
          - **Windows**: SmartScreen → *More info* → *Run anyway*.

          Signing does not affect what this build is for — the OS trust prompts it exercises (macOS Keychain password, Windows root-CA consent) behave identically.
          NOTES

  packaged-acceptance:
    name: Candidate packaged acceptance
    if: inputs.platform == 'all'
    needs: build
    # The reusable workflow confines write permission to draft fetching without a checkout;
    # all jobs that execute candidate code explicitly downgrade to contents: read.
    permissions:
      contents: write
    uses: ./.github/workflows/_e2e-packaged.yml
    with:
      ref: ${{ github.sha }}
      app_artifact: presto-linux-x86_64-${{ github.sha }}
      macos_app_artifact: presto-macos-arm64-${{ github.sha }}
      windows_app_artifact: presto-windows-x86_64-${{ github.sha }}
