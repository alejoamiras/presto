name: _E2E WebDriver (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: "GitHub Actions runner (e.g. ubuntu-latest, macos-latest)"
        required: true
        type: string
      mode:
        description: >-
          'dev' (tauri dev — fast, but is_dev()==true so it never runs the shipped custom-protocol path),
          'built-debug' (F-012/D8: `tauri build --debug` — a real custom-protocol binary that exercises the
          production asset+CSP path), or 'release' (release binary; note raw cargo build does NOT enable
          tauri's custom-protocol feature, so it is also is_dev()==true).
        required: false
        type: string
        default: "dev"
      screen:
        description: >-
          Linux Xvfb geometry as WIDTHxHEIGHTx24. screen-fit.spec.ts reads it back as WDIO_SCREEN and
          checks the window against it, so a short screen here is what proves the window fits one.
        required: false
        type: string
        default: "1280x1024x24"

jobs:
  e2e-webdriver:
    name: WebDriver E2E (${{ inputs.mode }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.mode == 'release' && 35 || 25 }}
    permissions:
      contents: read
    defaults:
      run:
        # bash on every platform — Git Bash on windows-latest runs the same scripts
        # (the alternative, pwsh, would need every step rewritten).
        shell: bash
        working-directory: packages/presto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Shared env setup (Bun, Rust toolchain + cache, Linux Tauri deps, bb sidecar) ──
      - uses: ./.github/actions/setup-presto
        with:
          # F-012: -v2 busts the shared cache once — an earlier PR build could have cached a stale/empty
          # frontend asset embed (codegen output) that a later build restored instead of regenerating.
          rust-cache-key: e2e-webdriver-v2-${{ inputs.mode }}
          rust-components: ""

      # ── Linux: WebDriver-specific extras (xvfb + tray + dbus) ──
      - name: Setup display (Linux)
        if: runner.os == 'Linux'
        working-directory: .
        env:
          SCREEN: ${{ inputs.screen }}
        run: |
          if [[ ! "$SCREEN" =~ ^[0-9]{3,4}x[0-9]{3,4}x24$ ]]; then
            echo "::error::the screen input must be WIDTHxHEIGHTx24"
            exit 1
          fi
          sudo apt-get install -y xvfb stalonetray dbus-x11
          Xvfb :99 -screen 0 "$SCREEN" &
          sleep 1
          eval "$(dbus-launch --sh-syntax)"
          stalonetray -d none --geometry 1x1+0+0 --kludges force_icons_size &
          sleep 1
          {
            echo "DISPLAY=:99"
            echo "NO_AT_BRIDGE=1"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
            echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID"
            echo "WDIO_SCREEN=$SCREEN"
          } >> "$GITHUB_ENV"

      # ── Build (release mode only) ──
      - name: Build app (release)
        if: inputs.mode == 'release'
        working-directory: packages/presto/src-tauri
        run: cargo build --release --features webdriver

      # ── Build (built-debug — F-012/D8: a real `tauri build` enables tauri's custom-protocol feature, so
      #    the webdriver run exercises the SHIPPED asset/CSP path that `tauri dev` and raw `cargo build` skip.
      #    Runs from packages/presto so tauri's beforeBuildCommand (bun run frontend:build) fires. ──
      - name: Build app (built-debug)
        if: inputs.mode == 'built-debug'
        run: bunx tauri build --debug --no-bundle --features webdriver

      # The app's WebDriver-only list hook polls this loopback feed, and verified-sites.spec.ts switches
      # what it serves through the state file's control endpoint.
      - name: Start the verified-sites feed
        run: |
          state="$RUNNER_TEMP/verified-sites-feed.json"
          bun scripts/verified-sites-e2e-feed.ts --state "$state" > "$RUNNER_TEMP/verified-sites-feed.log" 2>&1 &
          for _ in $(seq 1 100); do
            [ -s "$state" ] && break
            sleep 0.1
          done
          if [ ! -s "$state" ]; then
            echo "::error::the verified-sites feed wrote no state file"
            cat "$RUNNER_TEMP/verified-sites-feed.log"
            exit 1
          fi
          # The state's pid is Bun's own (a native Windows PID there), so Cleanup can kill exactly it.
          pid=$(S="$state" bun -e 'process.stdout.write(String((await Bun.file(process.env.S).json()).pid))')
          {
            echo "VERIFIED_SITES_E2E_FEED_STATE=$state"
            echo "VERIFIED_SITES_E2E_FEED_PID=$pid"
          } >> "$GITHUB_ENV"

      # ── Launch app (single step, no platform conditionals) ──
      - name: Launch app
        run: |
          # The app's WebDriver-only tray driver writes here, and tray-update.spec.ts reads it.
          export PRESTO_E2E_TRAY_REPORT="$RUNNER_TEMP/tray-report.json"
          echo "PRESTO_E2E_TRAY_REPORT=$PRESTO_E2E_TRAY_REPORT" >> "$GITHUB_ENV"
          # The list hook's feed and key, from the feed's state. The key is a two-line document whose
          # final newline `$(...)` strips, so it is put back.
          field() {
            F="$1" bun -e 'const s = await Bun.file(process.env.VERIFIED_SITES_E2E_FEED_STATE).json()
              process.stdout.write(String(s[process.env.F]))'
          }
          PRESTO_E2E_VERIFIED_SITES_URL=$(field url)
          PRESTO_E2E_VERIFIED_SITES_PUBKEY="$(field pubkey)"$'\n'
          export PRESTO_E2E_VERIFIED_SITES_URL PRESTO_E2E_VERIFIED_SITES_PUBKEY
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          # The custom bb picker's answer: a copy of the sidecar where only this user can write, which
          # Presto requires. Windows runners check out outside the user's profile, so it goes there.
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$RUNNER_OS" = "Windows" ]; then
            STAGE="$(cygpath -u "$USERPROFILE")/presto-e2e-custom-bb"
            mkdir -p "$STAGE"
          else
            STAGE=$(mktemp -d)
          fi
          install -m 755 "src-tauri/binaries/bb-$TRIPLE$EXE" "$STAGE/bb$EXE"
          PRESTO_E2E_CUSTOM_BB_PATH="$STAGE/bb$EXE"
          [ "$RUNNER_OS" = "Windows" ] && PRESTO_E2E_CUSTOM_BB_PATH=$(cygpath -w "$PRESTO_E2E_CUSTOM_BB_PATH")
          export PRESTO_E2E_CUSTOM_BB_PATH
          echo "PRESTO_E2E_CUSTOM_BB_PATH=$PRESTO_E2E_CUSTOM_BB_PATH" >> "$GITHUB_ENV"
          case "${{ inputs.mode }}" in
            release)     APP_CMD="./src-tauri/target/release/Presto$EXE" ;;
            built-debug) APP_CMD="./src-tauri/target/debug/Presto$EXE" ;;
            dev)
              # Exercise the real developer command. Tauri injects a loopback devUrl for its built-in
              # static server; the dynamic-window navigation guard must admit that exact origin.
              bunx tauri dev --no-watch --features webdriver > "$RUNNER_TEMP/tauri.log" 2>&1 &
              echo "TAURI_PID=$!" >> "$GITHUB_ENV"
              exit 0
              ;;
            *) echo "unknown WebDriver mode: ${{ inputs.mode }}" >&2; exit 1 ;;
          esac
          $APP_CMD > "$RUNNER_TEMP/tauri.log" 2>&1 &
          echo "TAURI_PID=$!" >> "$GITHUB_ENV"

      # ── Wait for readiness ──
      - name: Wait for app
        run: |
          echo "Waiting for WebDriver (:4445) and HTTP (:59833)..."
          # 450 iterations x 2s = 900s (15 min) — cold Rust cache, esp. a Windows
          # debug compile of the webdriver feature, can be slow on first run.
          for i in $(seq 1 450); do
            if ! kill -0 "$TAURI_PID" 2>/dev/null; then
              echo "::error::App process crashed during startup"
              cat "$RUNNER_TEMP/tauri.log" 2>/dev/null || true
              exit 1
            fi
            if curl -sf http://127.0.0.1:4445/status >/dev/null 2>&1 && \
               curl -sf http://127.0.0.1:59833/health >/dev/null 2>&1; then
              echo "Both servers ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Servers not ready after 900s"
          cat "$RUNNER_TEMP/tauri.log" 2>/dev/null || true
          exit 1

      # The updater smokes and the release build prove shipped binaries lack these names; that check
      # means something only if a build with the hooks demonstrably contains each of them.
      - name: Assert the WebDriver binary carries the test hooks
        env:
          MODE: ${{ inputs.mode }}
        run: |
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          PROFILE=debug
          [ "$MODE" = "release" ] && PROFILE=release
          BIN="src-tauri/target/$PROFILE/Presto$EXE"
          for name in PRESTO_E2E_TRAY_REPORT PRESTO_E2E_VERIFIED_SITES_URL PRESTO_E2E_VERIFIED_SITES_PUBKEY PRESTO_E2E_CUSTOM_BB_PATH; do
            if ! grep -qa "$name" "$BIN"; then
              echo "::error::$BIN does not contain $name, so the shipped-binary scans prove nothing"
              exit 1
            fi
          done

      # ── Run tests ──
      - name: Run WebDriver E2E tests
        run: bun run test:e2e:webdriver

      # ── Regression guard: the real feed check MUST be compiled out of webdriver
      #    builds (their update task runs on a stub that never finds an update).
      #    If the prompt window ever appears, it steals the
      #    active WebDriver context mid-test (see the 1.0.2 CI flake). Runs even
      #    on test failure so it always gives signal.
      - name: Assert no update prompt fired
        if: always()
        working-directory: .
        run: |
          if grep -q "Showing update prompt" "$RUNNER_TEMP/tauri.log" 2>/dev/null; then
            echo "::error::Update prompt fired in a webdriver build — the update check is not gated. See implementations-plan/ci-reliability-2026-05-29/diagnosis.md"
            grep -n "Showing update prompt\|Update available" "$RUNNER_TEMP/tauri.log" || true
            exit 1
          fi
          echo "OK — no update prompt in webdriver build"

      # ── Artifacts on failure ──
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webdriver-e2e-logs-${{ runner.os }}-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/tauri.log
            ${{ runner.temp }}/tray-report.json
            ${{ runner.temp }}/verified-sites-feed.log
          if-no-files-found: ignore
          retention-days: 7

      # ── Cleanup ──
      - name: Cleanup
        if: always()
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Git Bash has no pkill; use taskkill on the native processes (// escapes
            # the flags so MSYS doesn't path-mangle them).
            if [ -n "${VERIFIED_SITES_E2E_FEED_PID:-}" ]; then
              taskkill //F //PID "$VERIFIED_SITES_E2E_FEED_PID" 2>/dev/null || true
            fi
            if [ -n "${TAURI_PID:-}" ]; then
              taskkill //F //PID "$TAURI_PID" //T 2>/dev/null || true
            fi
            taskkill //F //IM Presto.exe 2>/dev/null || true
            taskkill //F //IM msedgewebview2.exe 2>/dev/null || true
          else
            if [ -n "${VERIFIED_SITES_E2E_FEED_PID:-}" ]; then
              kill "$VERIFIED_SITES_E2E_FEED_PID" 2>/dev/null || true
            fi
            pkill -P "${TAURI_PID:-0}" 2>/dev/null || true
            kill "${TAURI_PID:-0}" 2>/dev/null || true
            pkill -f "Presto" 2>/dev/null || true
            pkill -f stalonetray 2>/dev/null || true
            pkill -f Xvfb 2>/dev/null || true
            kill "$DBUS_SESSION_BUS_PID" 2>/dev/null || true
          fi
