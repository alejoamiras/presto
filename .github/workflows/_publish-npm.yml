name: _Publish npm package (reusable)

# Intentionally call-only. npm trusted publishing authenticates the top-level
# `.github/workflows/release-sdk.yml` workflow in the `npm-publish` environment; this workflow
# declares the OIDC permission and the calling job in release-sdk.yml delegates it.
#
# Three jobs, so no code resolved from the registry ever runs beside the publish credentials:
# `pack` builds the candidate and records its digest, `consumer-test` exercises that artifact with
# read-only permissions, and `publish` re-asserts the digest before `npm publish`. A job output is
# the only channel for the digest: an artifact can be replaced within a run, a recorded output cannot.
on:
  workflow_call:
    inputs:
      package:
        description: "Descriptor key in scripts/npm-packages.ts"
        required: true
        type: string
      version:
        description: "The version the release plan decided on; publication refuses any other"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag the candidate publishes under; promotion to latest is a separate step"
        required: false
        type: string
        default: testnet
      release_asset:
        description: "Optional repository file attached to the GitHub release"
        required: false
        type: string
        default: ""
      dependency_versions:
        description: "Comma-separated name=version pins for the package's workspace: dependencies"
        required: false
        type: string
        default: ""
    outputs:
      version:
        description: "The version published to npm"
        value: ${{ jobs.publish.outputs.version }}

env:
  CANDIDATE_ARTIFACT: npm-candidate-${{ inputs.package }}

jobs:
  pack:
    name: Pack ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      dir: ${{ steps.pkg.outputs.dir }}
      version_mode: ${{ steps.pkg.outputs.version_mode }}
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: Resolve the package from the descriptor
        id: pkg
        run: |
          # shellcheck disable=SC2016  # single quotes are deliberate: the JS must not shell-expand
          bun -e '
            import { resolvePackage } from "./scripts/npm-packages.ts";
            const pkg = resolvePackage(process.argv[1]);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\ndir=${pkg.dir}\nversion_mode=${pkg.versionMode}\n`);
          ' "$PACKAGE"

      - run: bun run --cwd "${{ steps.pkg.outputs.dir }}" build

      - name: Confirm the planned version is still the one to publish
        id: version
        env:
          PLANNED: ${{ inputs.version }}
        run: |
          version=$(bun scripts/get-sdk-publish-version.ts --package "$PACKAGE")
          if [ "$version" != "$PLANNED" ]; then
            echo "::error::the registry moved since planning: $PACKAGE would now publish $version, not the planned $PLANNED"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "$PACKAGE candidate: $version"

      - name: Fail closed if npm, git, or GitHub already contains the candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
        run: |
          tag="${PACKAGE_NAME}@${VERSION}"
          encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"

          # Only a registry 404 (a never-published name) counts as absence; any other failure aborts.
          if ! versions="$(npm view "$PACKAGE_NAME" versions --json 2> "$RUNNER_TEMP/npm-view.err")"; then
            if ! grep -q E404 "$RUNNER_TEMP/npm-view.err"; then
              echo "::error::npm view $PACKAGE_NAME failed: $(cat "$RUNNER_TEMP/npm-view.err")"
              exit 1
            fi
            versions='[]'
          fi
          if printf '%s' "$versions" | jq -e --arg version "$VERSION" 'if type == "array" then index($version) != null else . == $version end' >/dev/null; then
            echo "::error::$PACKAGE_NAME@$VERSION already exists on npm"
            exit 1
          fi

          remote_refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$remote_refs" ]; then
            echo "::error::git tag $tag already exists on origin"
            exit 1
          fi

          release_status="$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$encoded_tag")"
          case "$release_status" in
            404) ;;
            200) echo "::error::GitHub release $tag already exists"; exit 1 ;;
            *) echo "::error::GitHub release preflight returned HTTP $release_status"; exit 1 ;;
          esac

      - name: Prepare and pack the exact publish artifact
        id: pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEPENDENCY_VERSIONS: ${{ inputs.dependency_versions }}
        run: |
          deps=()
          IFS=',' read -ra pins <<< "$DEPENDENCY_VERSIONS"
          for pin in "${pins[@]}"; do
            [ -n "$pin" ] && deps+=(--dep "$pin")
          done
          bun "$GITHUB_WORKSPACE/scripts/prepare-sdk-publish.ts" "$VERSION" package.json "${deps[@]}"
          tarball="$(npm pack --silent)"
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          mkdir -p "$RUNNER_TEMP/candidate"
          mv "$tarball" "$RUNNER_TEMP/candidate/"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball (sha256 $sha256)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ runner.temp }}/candidate/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # Registry-resolved dependencies (and their install scripts, were they enabled) run here, with a
  # read-only token and no OIDC identity.
  consumer-test:
    name: Consume ${{ inputs.package }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ runner.temp }}/candidate

      - name: Test the packed artifact as an npm consumer
        env:
          TARBALL: ${{ runner.temp }}/candidate/${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
        run: |
          echo "$SHA256  $TARBALL" | sha256sum -c -
          bash scripts/sdk-tarball-consumer.sh "$TARBALL" "$PACKAGE"

  publish:
    name: Publish ${{ inputs.package }}
    needs: [pack, consumer-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      id-token: write
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      PACKAGE: ${{ inputs.package }}
      DIST_TAG: ${{ inputs.dist_tag }}
      VERSION: ${{ needs.pack.outputs.version }}
      PACKAGE_NAME: ${{ needs.pack.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org

      - name: Require an npm CLI with trusted-publishing support
        run: |
          npm_version="$(npm --version)"
          node -e 'const [major=0,minor=0,patch=0]=process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version" || {
            echo "::error::npm 11.5.1 or newer is required for trusted publishing (got $npm_version)"
            exit 1
          }
          echo "npm $npm_version"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ runner.temp }}/candidate

      - name: Assert the artifact is the one packed, then confirm the planned version
        id: version
        env:
          TARBALL: ${{ runner.temp }}/candidate/${{ needs.pack.outputs.tarball }}
          SHA256: ${{ needs.pack.outputs.sha256 }}
          PLANNED: ${{ inputs.version }}
        run: |
          echo "$SHA256  $TARBALL" | sha256sum -c -
          if [ "$VERSION" != "$PLANNED" ]; then
            echo "::error::packed $VERSION, planned $PLANNED"
            exit 1
          fi
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish the candidate to npm with OIDC
        # npm exchanges GitHub's OIDC identity through the configured trusted publisher.
        # Do not add a traditional token fallback to this run.
        run: npm publish "$TARBALL" --provenance --access public --tag "$DIST_TAG" --workspaces=false

      - name: Verify npm version, dist-tag, and provenance
        run: |
          for attempt in $(seq 1 10); do
            published="$(npm view "$PACKAGE_NAME@$VERSION" version 2>/dev/null || true)"
            tagged="$(npm view "$PACKAGE_NAME" "dist-tags.$DIST_TAG" 2>/dev/null || true)"
            if [ "$published" = "$VERSION" ] && [ "$tagged" = "$VERSION" ] && \
               bun scripts/sdk-release-verification.ts --package "$PACKAGE" "$VERSION" "$GITHUB_SHA"; then
              exit 0
            fi
            echo "Registry/provenance not consistent yet (attempt $attempt/10)"
            sleep 6
          done
          echo "::error::npm publish could not be verified"
          exit 1

      - name: Cryptographically verify registry signatures and provenance
        run: bun scripts/verify-sdk-package-signatures.ts --package "$PACKAGE" "$VERSION"

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIR: ${{ needs.pack.outputs.dir }}
          VERSION_MODE: ${{ needs.pack.outputs.version_mode }}
          RELEASE_ASSET: ${{ inputs.release_asset }}
        run: |
          tag="${PACKAGE_NAME}@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"

          if [ "$VERSION_MODE" = "aztec-derived" ]; then
            aztec_version="$(node -p "require('./$PACKAGE_DIR/package.json').dependencies['@aztec/stdlib']")"
            if [ "$VERSION" = "$aztec_version" ]; then
              notes="Aligned with Aztec testnet version \`$aztec_version\`."
            else
              notes="SDK revision for Aztec testnet version \`$aztec_version\`."
            fi
          else
            notes="Release of \`$PACKAGE_NAME\` $VERSION."
          fi
          assets=()
          if [ -n "$RELEASE_ASSET" ]; then assets+=("$RELEASE_ASSET"); fi
          gh release create "$tag" \
            --title "$tag" \
            --notes "$notes" \
            --latest=false \
            "${assets[@]}"

  # A fresh registry install of the published version, with a read-only token and no OIDC identity.
  verify:
    name: Verify ${{ inputs.package }}
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      PACKAGE_NAME: ${{ needs.pack.outputs.name }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Verify release records and a fresh registry install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${PACKAGE_NAME}@${VERSION}"
          remote_refs="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" "refs/tags/$tag^{}")"
          remote_sha="$(printf '%s\n' "$remote_refs" | awk '/\^\{\}$/ {print $1; exit}')"
          [ -z "$remote_sha" ] && remote_sha="$(printf '%s\n' "$remote_refs" | awk 'NR==1 {print $1}')"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "::error::remote tag resolves to $remote_sha, expected $GITHUB_SHA"
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' | grep -Fx "$tag"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --loglevel=error "$PACKAGE_NAME@$VERSION"
          installed="$(node -p "require('./node_modules/$PACKAGE_NAME/package.json').version")"
          [ "$installed" = "$VERSION" ] || {
            echo "::error::fresh install resolved $installed, expected $VERSION"
            exit 1
          }
          echo "Verified $PACKAGE_NAME@$VERSION; npm latest remains unchanged."
