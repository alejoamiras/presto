name: SDK Noir

on:
  workflow_dispatch:
  pull_request:
    branches: [main, security-hardening]

permissions:
  contents: read

# Cancel a superseded in-flight run when a new commit is pushed to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/sdk-noir/**'
              # The adapter depends on core.
              - 'packages/sdk-core/**'
              - 'fixtures/noir/**'
              # The live job builds the headless presto from this ref.
              - 'packages/presto/core/**'
              - 'packages/presto/server/**'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-presto/**'
              - '.github/actions/start-headless-presto/**'
              - 'scripts/**'
              - 'tsconfig.json'
              - 'tsconfig.scripts.json'
              - 'biome.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.bun-version'
              - '.github/workflows/sdk-noir.yml'
              - '.github/workflows/_ts-package-ci.yml'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/_ts-package-ci.yml
    with:
      package: presto-noir
      identity: true
      live: true

  sdk-noir-status:
    name: SDK Noir Status
    if: always()
    needs: [changes, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check results
        run: |
          results="${{ needs.changes.result }} ${{ needs.ci.result }}"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "Job failed or was cancelled: $r"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
