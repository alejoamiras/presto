name: Deploy Release Feed

on:
  workflow_dispatch:

concurrency:
  group: deploy-release-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    environment: release-feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assert main ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy Release Feed must run on refs/heads/main (got $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/release-feed typecheck
      - run: bun run --cwd packages/release-feed test
      - name: Deploy release-feed Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_RELEASE_FEED_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/presto-feed-upload.ndjson
        # This token edits Worker scripts only. Routes are managed separately with the site token.
        run: |
          test ! -e "$WRANGLER_OUTPUT_FILE_PATH"
          bunx wrangler versions upload --config packages/release-feed/wrangler.jsonc
          VERSION_ID=$(bun -e '
            const entries = (await Bun.file(process.env.WRANGLER_OUTPUT_FILE_PATH).text())
              .trim().split("\n").map(line => JSON.parse(line));
            const uploads = entries.filter(entry => entry.type === "version-upload");
            if (uploads.length !== 1) throw new Error("Expected exactly one uploaded version");
            const upload = uploads[0];
            if (upload.version !== 1 || upload.worker_name !== "presto-release-feed" ||
                !/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/.test(upload.version_id)) {
              throw new Error("Unexpected feed upload result");
            }
            console.log(upload.version_id);
          ')
          bunx wrangler versions deploy "$VERSION_ID@100%" --yes --config packages/release-feed/wrangler.jsonc
