name: Release Bot Token Check

# Dispatch-only diagnostic. Runs the release bot's real PR path (bot-push + bot-pr, the actions every
# bot PR uses) with the permissions `bump-source` and `bump-playground` mint, and proves that
# the App token can push, open a CI-triggering PR, label and comment on it, and enable auto-merge
# pinned to the pushed head — WITHOUT merging anything. Auto-merge is switched off again at once:
# the PR's required checks have not started by then, so it cannot fire.
#
# Dispatched from a feature ref, the smoke branch carries that ref's diff. Cleanup always closes the
# PR, deletes the branch and cancels the runs it triggered. The App token does the writes; the
# default GITHUB_TOKEN does only the read assertions and the run cancellation.

on:
  workflow_dispatch:

permissions:
  checks: read
  statuses: read
  pull-requests: read
  actions: write # cancel the gate runs the smoke PR triggers, during cleanup

jobs:
  check:
    name: Mint App token + prove push/PR/auto-merge/CI-trigger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BR: release-bot-smoke-${{ github.run_id }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Under packages/presto/** so the Presto gate fires, and its long jobs keep a required check
      # pending for minutes.
      - name: Write the smoke change
        run: printf 'release-bot token smoke %s\n' "$BR" > packages/presto/.release-bot-smoke

      - name: Push the smoke branch (contents:write)
        id: push
        uses: ./.github/actions/bot-push
        with:
          branch: ${{ env.BR }}
          message: "chore: release-bot token smoke (throwaway)"
          paths: packages/presto/.release-bot-smoke

      - name: Open the smoke PR with auto-merge (pull_requests:write + contents:write)
        id: pr
        uses: ./.github/actions/bot-pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.BR }}
          title: "chore: release-bot token smoke (auto-closing, do not merge)"
          body: Throwaway PR verifying the release-bot GitHub App token. Auto-closed by the Release Bot Token Check workflow.
          auto-merge: "true"
          head: ${{ steps.push.outputs.head }}

      - name: Prove auto-merge registered, then switch it off
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          method="$(gh pr view "$PR_NUM" --json autoMergeRequest --jq '.autoMergeRequest.mergeMethod // empty')"
          gh pr merge "$PR_NUM" --disable-auto
          if [ "$method" != SQUASH ]; then
            echo "::error::auto-merge did not register on PR #$PR_NUM (got '${method:-none}')"
            exit 1
          fi
          echo "✅ auto-merge registered (squash, pinned to the pushed head) and switched off"

      # The @aztec update workflows label their PRs and close stale ones with a comment; those go
      # through the issues label/comment endpoints.
      - name: Prove issues:write (label + comment)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUM: ${{ steps.pr.outputs.number }}
        run: |
          gh pr edit "$PR_NUM" --add-label dependencies
          gh pr comment "$PR_NUM" --body "release-bot issues:write smoke — auto-closing"
          echo "✅ issues:write — label and comment"

      # Check-runs on the head are what guarantee the required *-status checks exist, so a real bump
      # PR's auto-merge waits for them instead of merging ungated.
      - name: Prove the App-token PR triggers CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for _ in $(seq 1 18); do
            n=$(gh api "repos/$REPO/commits/$BR/check-runs" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "✅ App-token PR triggered CI ($n check-run(s))"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No check-runs appeared on the App-token PR within ~3min. Investigate before relying on the App token at a stable cut."
          exit 1

      - name: Clean up
        if: always()
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          pr="$(GH_TOKEN="$APP_TOKEN" gh pr list --repo "$REPO" --head "$BR" --state open \
            --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not) | .number][0] // empty')"
          if [ -n "$pr" ]; then
            GH_TOKEN="$APP_TOKEN" gh pr merge "$pr" --repo "$REPO" --disable-auto 2>/dev/null
            GH_TOKEN="$APP_TOKEN" gh pr close "$pr" --repo "$REPO" --comment "release-bot smoke cleanup"
          fi
          GH_TOKEN="$APP_TOKEN" gh api -X DELETE "repos/$REPO/git/refs/heads/$BR" 2>/dev/null
          for rid in $(gh api "repos/$REPO/actions/runs?branch=$BR&per_page=100" --jq '.workflow_runs[].id' 2>/dev/null); do
            gh api -X POST "repos/$REPO/actions/runs/$rid/cancel" >/dev/null 2>&1
          done
          echo "── cleanup done (PR closed, branch deleted, triggered runs cancelled) ──"
