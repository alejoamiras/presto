name: _TS package CI (reusable)

# The PR gate every publishable TypeScript package shares (scripts/npm-packages.ts): lint,
# typecheck, unit tests, and the packed-artifact consumer. Per-package workflows (sdk.yml,
# sdk-core.yml, ...) are thin callers; `sdk.yml`'s `package` dispatch input runs this for any
# descriptor entry on a feature ref before that entry's own workflow is registered on main.
on:
  workflow_call:
    inputs:
      package:
        description: "Descriptor key in scripts/npm-packages.ts"
        required: true
        type: string
      e2e_presto:
        description: "Run the SDK e2e against the sandbox with a headless presto (the chonk parity gate)"
        required: false
        type: boolean
        default: false
      identity:
        description: "Run the package's `test:identity` (bb.js WASM must reproduce the committed Noir fixtures)"
        required: false
        type: boolean
        default: false
      live:
        description: "Run the package's `test:e2e` against a headless presto built from this ref with the real bb"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      dir: ${{ steps.pkg.outputs.dir }}
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Resolve the package from the descriptor
        id: pkg
        run: |
          # shellcheck disable=SC2016  # single quotes are deliberate: the JS must not shell-expand
          bun -e '
            import { resolvePackage } from "./scripts/npm-packages.ts";
            const pkg = resolvePackage(process.argv[1]);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `dir=${pkg.dir}\n`);
          ' "$PACKAGE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Typecheck
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd "${{ needs.resolve.outputs.dir }}" test:lint

  unit-tests:
    name: Unit Tests
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run --cwd "${{ needs.resolve.outputs.dir }}" test:unit
      # Release tooling (bump/publish-version scripts) rides every package pipeline.
      # Typecheck too: Bun's test transpile accepts type errors tsc rejects.
      - run: bun run test:scripts
      - run: bun run typecheck:scripts

  # Nothing else validates the PUBLISHED artifact: workspace consumers use the source `exports`, so a
  # broken `dist` `main`/`types`/`exports` rewrite, a missing dist, or a peers-vs-deps resolution
  # surprise would ship undetected. This job packs the real tarball (via the same
  # `prepare-sdk-publish.ts` the publish workflow runs), installs it the way a real consumer does —
  # DEFAULT `npm install` on a fresh Node — and typechecks against it. Workspace dependencies are
  # installed from their PACKED candidates (bootstrap mode): a core + adapter change is validated
  # before either is on npm. The release rerun in _publish-npm.yml resolves them from the registry.
  tarball-consumer:
    name: Tarball Consumer
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Node 24 pins the npm the consumers resolve with (recorded in the log) so the peer evidence is
      # reproducible; a real consumer uses npm, not Bun.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Build + pack the candidate and its workspace dependencies
        id: pack
        run: |
          echo "npm $(npm --version), node $(node --version)"
          bun scripts/pack-candidate.ts --package "$PACKAGE" --version 0.0.1-tarball-ci --out "$RUNNER_TEMP/candidate"
      - name: Consume the tarball (exact host, default npm) — packed dependencies, bootstrap mode
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          WITH: ${{ steps.pack.outputs.with }}
        run: |
          with=()
          IFS=',' read -ra pairs <<< "$WITH"
          for pair in "${pairs[@]}"; do
            [ -n "$pair" ] && with+=(--with "$pair")
          done
          bash scripts/sdk-tarball-consumer.sh "$TARBALL" "$PACKAGE" "${with[@]}"

  e2e:
    name: E2E Tests
    if: inputs.e2e_presto
    uses: ./.github/workflows/_e2e.yml
    with:
      # Build + run the headless presto on :59833 so the e2e exercises the NATIVE proving path
      # against the local sandbox — not just the WASM fallback. This is the standing parity gate that
      # the SDK-only release relies on (proves the deployed presto handles the pinned bb version).
      build_presto: true

  # bb.js WASM must reproduce the committed fixtures byte for byte: the native route is tested
  # against those same bytes in presto.yml, so this is what makes the two provers interchangeable.
  identity:
    name: WASM Identity
    if: inputs.identity
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Cache the bb CRS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ runner.os }}-${{ hashFiles('packages/sdk/package.json') }}
      - run: bun run --cwd "${{ needs.resolve.outputs.dir }}" test:identity

  # The adapter against a headless presto built from THIS ref with the real bb sidecar, on an
  # isolated port with a private PRESTO_HOME. The suite fails without PRESTO_URL, so a missing
  # environment can never pass as a skip.
  live:
    name: Live Presto
    if: inputs.live
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-presto
        with:
          rust-cache-key: presto-ultra-honk-x86_64-unknown-linux-gnu
          rust-workspaces: |
            packages/presto/core -> target
            packages/presto/server -> target
          rust-components: ""
          # Headless deps only; the prebuild copies the real bb sidecar (a node_modules copy on Linux).
          install-tauri-system-deps: "false"
          run-prebuild: "true"
      - name: Cache the bb CRS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ runner.os }}-${{ hashFiles('packages/sdk/package.json') }}
      - name: Point at the sidecar bb
        run: echo "BB_BINARY_PATH=$GITHUB_WORKSPACE/packages/presto/src-tauri/binaries/bb-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - name: Build headless server
        run: cargo build --locked --manifest-path packages/presto/server/Cargo.toml
      - name: Start an isolated headless presto
        id: presto
        uses: ./.github/actions/start-headless-presto
        with:
          binary: packages/presto/server/target/debug/presto-server
          port: "59910"
          presto-home: ${{ runner.temp }}/presto-home-live
      - name: Adapter e2e against the live presto
        env:
          PRESTO_URL: ${{ steps.presto.outputs.url }}
        run: bun run --cwd "${{ needs.resolve.outputs.dir }}" test:e2e
      - name: Stop the headless instance
        if: always()
        run: kill "${{ steps.presto.outputs.pid }}" 2>/dev/null || true
      - name: Upload presto log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presto-live-log-${{ inputs.package }}
          path: ${{ runner.temp }}/presto-home-live/server.log
          if-no-files-found: ignore
          retention-days: 7
