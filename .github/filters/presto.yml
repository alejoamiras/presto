  - 'packages/presto/playwright.config.mjs'
  - 'packages/presto/wdio.conf.ts'
  - 'packages/presto/verified-sites/key.pub'
  - 'packages/presto/scripts/bb-version.ts'
  - 'packages/presto/scripts/build-frontend.ts'
  - 'packages/presto/scripts/copy-bb*.ts'
  - 'scripts/aztec-manifest.ts'
  - 'packages/presto/scripts/ultra-honk-smoke*.ts'
  - 'fixtures/noir/**'
  - 'scripts/download-bb*.ts'
  - 'scripts/__fixtures__/**'
  - 'packages/presto/package.json'
  - 'packages/sdk/package.json'
  - 'package.json'
  - 'bun.lock'
  - 'bunfig.toml'
  - '.bun-version'
  - 'rust-toolchain.toml'
  - '.github/actions/setup-presto/**'
  - '.github/actions/playwright-cache/**'
  - '.github/workflows/_e2e-webdriver.yml'
  - '.github/workflows/presto.yml'
  - '.github/filters/presto.yml'

