release_tooling:
  # This is the cheap repository-lint + script-contract job. Runtime changes still
  # run it; release/tooling-only changes stop here unless an updater contract changed.
  - 'packages/presto/**'
  - 'scripts/**'
  - 'CLAUDE.md'
  - 'README.md'
  - 'docs/RELEASE_RUNBOOK.md'
  - 'biome.json'
  - 'clippy.toml'
  - 'rust-toolchain.toml'
  - 'tsconfig.json'
  - 'tsconfig.scripts.json'
  - 'package.json'
  - 'bun.lock'
  - 'bunfig.toml'
  - '.bun-version'
  - '.github/scripts/**'
  # The release bot's shared PR path and every workflow that runs it (scripts/bot-pr.test.ts).
  - '.github/actions/bot-push/**'
  - '.github/actions/bot-pr/**'
  - '.github/workflows/release-sdk.yml'
  - '.github/workflows/_aztec-update.yml'
  - '.github/workflows/aztec-stable.yml'
  - '.github/workflows/release-bot-token-check.yml'
  - '.github/workflows/release-presto.yml'
  - '.github/workflows/_e2e-packaged.yml'
  - '.github/workflows/_e2e-updater.yml'
  - '.github/workflows/_e2e-updater-linux.yml'
  - '.github/workflows/_e2e-updater-windows.yml'
  - '.github/workflows/_e2e-webdriver.yml'
  - '.github/workflows/_e2e-crash-recovery-windows.yml'
  - '.github/workflows/smoke-uninstall-windows.yml'
  - '.github/workflows/smoke-updater-unix.yml'
  - '.github/workflows/smoke-updater-windows.yml'
  - '.github/workflows/update-feed-health.yml'
  # The verified-sites workflows: their contract test runs here, and the sign workflow is a bot-pr user.
  - '.github/workflows/sign-verified-sites.yml'
  - '.github/workflows/publish-verified-sites.yml'
  - '.github/workflows/verified-sites-health.yml'
  - 'packages/release-feed/**'
  - '.github/workflows/presto.yml'
  - '.github/filters/presto.yml'

