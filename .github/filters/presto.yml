# Presto PR routing contract. Groups intentionally overlap where one change
# affects more than one independently useful assurance layer.
rust_platform:
  - 'packages/presto/core/**'
  - 'packages/presto/server/**'
  - 'packages/presto/src-tauri/**'
  # Compiled in. The list is not: the build embeds the newest record, which routes to
  # verified_sites_feed alone so record PRs stay off the platform lanes.
  - 'packages/presto/verified-sites/key.pub'
  - 'packages/sdk/package.json'
  - 'package.json'
  - 'bun.lock'
  - 'bunfig.toml'
  - 'clippy.toml'
  - 'rust-toolchain.toml'
  - '.bun-version'
  - '.github/actions/setup-presto/**'
  - '.github/workflows/presto.yml'
  - '.github/filters/presto.yml'

