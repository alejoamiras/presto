  - '.github/filters/presto.yml'

verified_sites_feed:
  # The list, its signed history and key, and everything that signs, records, verifies or publishes
  # it. Records route here alone, so a release-bot record PR runs this job and the lint job only.
  - 'packages/presto/verified-sites.json'
  - 'packages/presto/verified-sites/**'
  - 'packages/presto/core/**'
  - 'packages/presto/scripts/verified-sites-*'
  - '.github/scripts/verified-sites-kv-guard.sh'
  - '.github/workflows/sign-verified-sites.yml'
  - '.github/workflows/publish-verified-sites.yml'
