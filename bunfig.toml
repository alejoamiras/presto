# Supply-chain hardening. Refuse installing any dependency version published
# less than 7 days ago, so a freshly-published malicious release (e.g. a hijacked
# popular package — the May 2026 @tanstack worm compromised 42 packages within 6
# minutes of publish) is never pulled into a build during the window before the
# compromise is typically caught and yanked.
#
# Affects dependency RESOLUTION (bun add / bun update). Already-locked installs
# (`bun install --frozen-lockfile`, what CI runs) are unaffected — they install
# exactly what bun.lock pins.
[install]
# Isolated linker: packages materialize under node_modules/.bun instead of a hoisted
# copy-tree (~4x faster installs measured here; the shared download cache is unchanged and
# already CI-cached). Layout-sensitive consumers must resolve from their own package dir,
# never assume a hoisted root entry — packaged-e2e-swap-sdk.sh is the known such consumer.
linker = "isolated"
minimumReleaseAge = 604800 # 7 days, in seconds

# Aztec exemption (owner decisions 2026-08-18, extended to the v6 scopes 2026-09-28): Aztec is
# this product's first-party upstream, versions are exact-pinned, and every bump lands as a
# human-reviewed PR, but Aztec releases are consumed same-day, inside the window above. Residual
# risk accepted: for these packages there is no 7-day observation window, so a compromised
# `@aztec/`, `@aztec-labs/` or `@aztec-foundation/` publish would not be age-filtered (see
# docs/SECURITY_MODEL.md). Every other scope keeps the full quarantine.
#
# EXACT NAMES ONLY: a scope glob is silently ignored (verified on Bun 1.3.14 and 1.4.0), and the
# age filter applies to transitive resolution too, so this list must cover the full resolved
# Aztec graph. A bump that adds a transitive fails install with a named min-age error: add that
# name here and prune names that leave the lock; scripts/bunfig-aztec-excludes.test.ts enforces
# both directions.
minimumReleaseAgeExcludes = [
  "@aztec-foundation/bb-avm-sim",
  "@aztec-foundation/bb-avm-sim-darwin-arm64",
  "@aztec-foundation/bb-avm-sim-darwin-x64",
